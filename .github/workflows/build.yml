name: Build

on:
  workflow_call:
    inputs:
      project:
        description: '项目目录（如 library/ruby）'
        required: true
        type: string
      version:
        description: '指定版本号（留空=自动检测最新）'
        required: false
        type: string

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # loongarch64 CI 机器可能是 dnf 或 apt 包管理
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          if command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y python3 python3-pip wget
          else
            $SUDO apt-get update
            $SUDO apt-get install -y python3 python3-pip wget
          fi
          python3 -m pip install --break-system-packages pyyaml

      - name: Build (不推送)
        run: |
          ARGS="${{ inputs.project }}"
          if [ -n "${{ inputs.version }}" ]; then
            ARGS="$ARGS ${{ inputs.version }}"
          fi
          python3 tools/build.py $ARGS
