name: Build & Push

on:
  workflow_call:
    inputs:
      project:
        description: '项目目录（如 library/ruby）'
        required: true
        type: string
      version:
        description: '指定版本号（留空=自动检测最新）'
        required: false
        type: string

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # loongarch64 CI 机器可能是 dnf 或 apt 包管理
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          if command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y python3 python3-pip wget
          else
            $SUDO apt-get update
            $SUDO apt-get install -y python3 python3-pip wget
          fi
          python3 -m pip install --break-system-packages pyyaml

      - name: Build and push
        run: |
          ARGS="${{ inputs.project }}"
          if [ -n "${{ inputs.version }}" ]; then
            ARGS="$ARGS ${{ inputs.version }}"
          fi
          python3 tools/build.py $ARGS

      - name: Commit version tracking
        run: |
          # 无变更则跳过
          if git diff --quiet && git diff --staged --quiet; then
            echo "没有新版本需要提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.project }}/processed_versions.txt
          git commit -m "chore(${{ inputs.project }}): 更新版本跟踪"

          # push with retry
          MAX_RETRIES=1
          ATTEMPT=0
          while true; do
            git pull --rebase origin main
            if git push origin main; then
              echo "推送成功"
              break
            fi

            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -gt "$MAX_RETRIES" ]; then
              echo "::error::推送失败，已重试 ${MAX_RETRIES} 次"
              exit 1
            fi
            echo "::warning::推送冲突，第 ${ATTEMPT} 次重试..."
          done
