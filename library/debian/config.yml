# library/debian/config.yml
project:
  org: library
  name: debian

version_source:
  type: script
  script: get_latest_version.sh

variants:
  - name: "standard"
    template: "Dockerfile-standard.template"
    tags:
      - "{version}"
      - "latest"
  - name: "slim"
    template: "Dockerfile-slim.template"
    tags:
      - "{version}-slim"

# dockerfiles 目录的 .gitignore 规则
gitignore: |
  *.tar.xz
  *.tar.xz.sha256
  rootfs.*
  Release
  InRelease
  snapshot-url

push:
  registry: "lcr.loongnix.cn"
  repository: "library/debian"
